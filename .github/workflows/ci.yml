name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend CI Job (Python / FastAPI)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Audit & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Pytest Suite
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No unit tests directory found yet. Skipping pytest step."
          fi

  # ---------------------------------------------------------------------------
  # 2. Frontend CI Job (React / TypeScript / Vite)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run TypeScript Verification (tsc)
        run: npx tsc --noEmit

      - name: Test Production Vite Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000

  # ---------------------------------------------------------------------------
  # 3. Dockerfile Linting Job
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Dockerfile Linter (Hadolint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile
          ignore: DL3008,DL3013 # Ignore minor pinned apt/pip version warnings

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile
          ignore: DL3018 # Ignore minor apk pinned version warnings