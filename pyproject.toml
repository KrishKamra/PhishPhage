[project]
name = "phishphage-backend"
version = "1.1.0"
description = "FastAPI backend for forensic phishing detection"
authors = [{name = "Krish Kamra"}]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "nltk>=3.8.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "httpx>=0.24.0"
]